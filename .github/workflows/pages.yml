# Publish the dashboard and the app to GitHub Pages.
#
# The site is served from the `gh-pages` branch, so this workflow builds the
# site and force-pushes it there. It deliberately does not use
# actions/configure-pages + deploy-pages: those need the Pages API to create or
# reconfigure the site, which the Actions token is refused ("Resource not
# accessible by integration"). Pushing a branch only needs `contents: write`.
#
# The build is a copy, not a bundle: the repository also holds a second product
# (Amazon Market Research Pro: extension/, admin/, supabase/) plus migrations
# and notes, and a host pointed at the root would serve all of it.
name: Pages

on:
  push:
    branches: [claude/admin-dashboard-design-ptn7z5]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push replaces an older one rather than racing
# it, so the live site always reflects the newest push that finished.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: bash scripts/build-site.sh

      # Native ES modules resolve by path, so a missing file is a blank page
      # rather than an error. Fail here instead.
      - name: Check the entry points resolve
        run: |
          test -f public/index.html
          test -f public/.nojekyll
          test -f public/app/index.html
          test -f public/app/assets/js/shared.js
          test -f public/dashboard/index.html
          test -f public/dashboard/assets/js/data/registry.js
          echo "$(find public -type f | wc -l) files"

      # The deploy branch carries no history worth keeping, so it is rebuilt
      # from scratch each time. Pushes made with GITHUB_TOKEN do not start other
      # workflows, so this cannot loop.
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
